apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: araba-degerleme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: araba-degerleme/notification-service:latest
          imagePullPolicy: Never
