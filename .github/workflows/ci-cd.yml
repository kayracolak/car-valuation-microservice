name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # 1. LINT
  # ─────────────────────────────────────────
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Linter
        run: pip install ruff

      - name: Run Ruff (syntax & undefined names only)
        run: ruff check . --select=E9,F63,F7,F82 --exclude .venv --exclude __pycache__

  # ─────────────────────────────────────────
  # 2. TEST
  # ─────────────────────────────────────────
  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Install Dependencies
        run: pip install -r requirements-test.txt

      - name: Run Tests
        run: pytest tests/ -v --tb=short
        env:
          OPENAI_API_KEY: test-dummy-key

  # ─────────────────────────────────────────
  # 3. BUILD
  # ─────────────────────────────────────────
  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: docker compose build

  # ─────────────────────────────────────────
  # 4. DEPLOY (only on push to main)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy System
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deployment Summary
        run: |
          echo "========================================"
          echo "  Car Valuation System - CI/CD"
          echo "========================================"
          echo ""
          echo "✓ Lint passed"
          echo "✓ Tests passed"
          echo "✓ Docker images built"
          echo ""
          echo "─── Deploy with Docker Compose ───"
          echo "  docker compose down"
          echo "  docker compose up -d --build"
          echo ""
          echo "─── Deploy with Kubernetes ───"
          echo "  kubectl apply -f k8s/"
          echo "========================================"
